name: Deploy website

on:
  push:
    branches: [main]
    paths: ["website/**", "apps/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website and app dependencies
        run: npm install -w website -w apps/shared -w apps/patient -w apps/physician --no-audit --no-fund
      - name: Build website
        run: npm run build -w website
      - name: Build the patient and physician web apps
        run: npm run build:apps -w website
        env:
          # Public identifiers, set in GitHub → Settings → Secrets and variables → Actions → Variables.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_PATIENT_POOL_ID: ${{ vars.EXPO_PUBLIC_PATIENT_POOL_ID }}
          EXPO_PUBLIC_PATIENT_CLIENT_ID: ${{ vars.EXPO_PUBLIC_PATIENT_CLIENT_ID }}
          EXPO_PUBLIC_PHYSICIAN_POOL_ID: ${{ vars.EXPO_PUBLIC_PHYSICIAN_POOL_ID }}
          EXPO_PUBLIC_PHYSICIAN_CLIENT_ID: ${{ vars.EXPO_PUBLIC_PHYSICIAN_CLIENT_ID }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
