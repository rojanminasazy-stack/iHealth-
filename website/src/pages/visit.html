<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>iHealthé visit</title>
<style>
  :root { --navy:#1b2d52; --ink:#0b1424; --bad:#b83a3a; }
  html, body { margin:0; height:100%; background:var(--ink); color:#fff; font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  #remote { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#0b1424; }
  #local { position:fixed; right:14px; top:calc(14px + env(safe-area-inset-top,0px)); width:28vw; max-width:150px; aspect-ratio:3/4; object-fit:cover; border-radius:12px; border:2px solid rgb(255 255 255 / .6); background:#22324f; z-index:2; }
  #status { position:fixed; left:0; right:0; top:42%; text-align:center; font-size:18px; padding-inline:24px; z-index:1; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; gap:14px; background:linear-gradient(transparent, rgb(0 0 0 / .55)); z-index:3; }
  button { font:inherit; font-weight:650; font-size:15px; border:0; border-radius:999px; padding:14px 18px; min-width:64px; background:rgb(255 255 255 / .18); color:#fff; cursor:pointer; }
  button[aria-pressed="true"] { background:#fff; color:var(--navy); }
  button.end { background:var(--bad); }
  button:focus-visible { outline:3px solid #8fb0ea; outline-offset:2px; }
</style>
</head>
<body>
<video id="remote" autoplay playsinline></video>
<video id="local" autoplay playsinline muted></video>
<audio id="audio" autoplay></audio>
<p id="status" role="status">Connecting…</p>
<div class="bar">
  <button id="mute" aria-pressed="false">Mute</button>
  <button id="camera" aria-pressed="false">Camera off</button>
  <button id="flip">Flip</button>
  <button id="leave" class="end">Leave</button>
</div>
<script type="module" src="/visit.js"></script>
</body>
</html>
